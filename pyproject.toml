[project]
name = "microverse"
version = "0.1.0"
description = "Long-running multi-agent simulation that produces artifacts on local Ollama gemma4:e4b"
readme = "README.md"
authors = [
    { name = "TheIllusionOfLife", email = "TheIllusionOfLife@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "json-repair>=0.59.5",
    "ollama>=0.6.2",
    "pydantic>=2",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Ollama server with gemma4:e4b pulled",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Active rules. Skipping ANN/D for now (too noisy at this stage); revisit later.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "T20", "ERA"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests can use print() and looser style.
"tests/**/*.py" = ["T20", "PT011"]
# CLI entrypoints need print() for human output.
"src/microverse/ops/metrics.py" = ["T20"]
"src/microverse/run.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
files = ["src/microverse"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
