[project]
name = "microverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheIllusionOfLife", email = "TheIllusionOfLife@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "json-repair>=0.59.5",
    "ollama>=0.6.2",
    "pydantic>=2",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
microverse = "microverse:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Ollama server with gemma4:e4b pulled",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
